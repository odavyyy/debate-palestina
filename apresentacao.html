<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0d14">
<title>Apresentação · Genocídio na Palestina</title>
<link rel="stylesheet" href="css/base.css">
<style>
  /* Versão sem celular: só slides, com fotos. Funciona com teclado, clique ou toque. */
  html, body { height: 100%; overflow: hidden; background: #000; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center center; transform: translate(-50%, -50%) scale(.5); background: var(--bg); }

  #top { position: absolute; left: 0; right: 0; top: 0; height: 88px; display: flex; align-items: center; gap: 24px; padding: 0 72px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 2; }
  #top .show { font-family: var(--head); font-weight: 500; font-size: 26px; letter-spacing: -.01em; }
  #top .show span { color: var(--muted); font-weight: 400; }
  #top .sp { flex: 1; }
  #top .who { color: var(--muted); font-size: 24px; }
  #top .who b { color: var(--text); font-weight: 500; }
  #top .count { font-family: var(--font-mono); color: var(--muted); font-size: 22px; min-width: 88px; text-align: right; }
  #bar { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--action); transition: width 400ms var(--ease); z-index: 2; }

  #slide { position: absolute; left: 0; right: 0; top: 88px; bottom: 0; }
  .content { position: absolute; left: 72px; top: 0; bottom: 0; right: 72px; padding: 64px 0 56px; display: flex; flex-direction: column; z-index: 1; }
  .kicker { font-family: var(--head); color: var(--action); font-weight: 500; font-size: 28px; letter-spacing: -.005em; }
  h1 { font-size: 84px; line-height: 1.04; margin: 16px 0 40px; letter-spacing: var(--display-tracking); }
  .body { font-size: 30px; line-height: 1.45; flex: 1; min-height: 0; }

  /* foto do lado (slides de conteúdo) */
  .side .content { right: 736px; }
  .side .ph { position: absolute; right: 72px; top: 64px; bottom: 56px; width: 616px; display: flex; flex-direction: column; gap: 14px; }
  .side .ph .img { flex: 1; min-height: 0; border-radius: var(--r-lg); overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .side .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .side .ph.map .img { background: #cfe8f7; }
  .side .ph.map img { object-fit: contain; }
  .ph figcaption { font-size: 22px; line-height: 1.4; color: var(--text); opacity: .9; }
  .ph figcaption small { display: block; color: var(--muted); font-size: 17px; margin-top: 4px; }
  .side h1 { font-size: 72px; }
  .side .cards.c4 { grid-template-columns: repeat(2, 1fr); }
  .side .cards.c5 { grid-template-columns: repeat(3, 1fr); }

  /* foto grande (capa) */
  .hero .ph { position: absolute; right: 0; top: 0; bottom: 0; width: 52%; margin: 0; }
  .hero .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .ph::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, rgba(10,13,20,.7) 22%, rgba(10,13,20,0) 55%); z-index: 1; }
  .hero .ph figcaption { position: absolute; right: 40px; bottom: 32px; max-width: 640px; text-align: right; z-index: 1; background: rgba(10,13,20,.72); padding: 10px 16px; border-radius: var(--r-sm); font-size: 20px; }
  .hero .ph figcaption small { font-size: 16px; }
  .hero .content { right: 46%; }
  .hero.cover h1 { font-size: 128px; line-height: .98; letter-spacing: -.036em; }

  .lead { font-size: 38px; color: var(--text); line-height: 1.4; margin: 0 0 24px; }
  .rule { margin-top: 32px; font-size: 30px; padding: 20px 28px; border-left: 4px solid var(--action); background: var(--panel); border-radius: 0 var(--r-md) var(--r-md) 0; line-height: 1.4; }
  .note { margin-top: 24px; font-size: 24px; color: var(--muted); line-height: 1.45; }
  .src { color: var(--muted); font-size: 22px; margin: 12px 0 28px; }
  .cards { display: grid; gap: 24px; }
  .cards.c2 { grid-template-columns: repeat(2, 1fr); }
  .cards.c3 { grid-template-columns: repeat(3, 1fr); }
  .cards.c4 { grid-template-columns: repeat(4, 1fr); }
  .cards.c5 { grid-template-columns: repeat(5, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 28px; }
  .card h3 { margin: 8px 0 10px; font-size: 30px; line-height: 1.15; }
  .card p { margin: 0; color: var(--text); opacity: .86; font-size: 24px; line-height: 1.42; }
  .card .big { font-family: var(--font-mono); font-size: 28px; color: var(--action); }
  .card.stat .num { font-family: var(--head); font-weight: 500; font-size: 60px; white-space: nowrap; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .cards.small .card { padding: 18px; }
  .cards.small .card b { font-family: var(--font-mono); font-weight: 500; font-size: 30px; color: var(--action); display: block; margin-bottom: 6px; }
  .cards.small .card p { font-size: 23px; }
  blockquote { margin: 0; font-size: 38px; line-height: 1.3; font-family: var(--head); font-weight: 500; letter-spacing: -.015em; padding-left: 32px; border-left: 4px solid var(--action); }
  .timeline { list-style: none; padding: 0; margin: 0; display: grid; }
  .timeline li { display: grid; grid-template-columns: 140px 1fr; gap: 28px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .timeline li:first-child { border-top: 1px solid var(--line); }
  .timeline b { font-family: var(--font-mono); font-weight: 500; font-size: 30px; color: var(--action); }
  .timeline span { font-size: 27px; color: var(--text); }
  .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
  .points li { font-size: 27px; padding: 16px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); line-height: 1.4; }
  .points li b { font-weight: 600; }
  .sources { margin-top: 28px; font-size: 21px; color: var(--muted); line-height: 1.55; }

  .credits { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 48px; font-size: 19px; line-height: 1.45; color: var(--muted); }
  .credits b { color: var(--text); font-weight: 500; }

  /* entrada do slide */
  #slide.enter .content > * { animation: s-in 520ms var(--ease-enter) both; }
  #slide.enter .content > :nth-child(2) { animation-delay: 60ms; }
  #slide.enter .content > :nth-child(3) { animation-delay: 140ms; }
  #slide.enter .ph { animation: s-fade 700ms var(--ease-enter) both; }
  @keyframes s-in { from { transform: translateY(18px); opacity: 0; } }
  @keyframes s-fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #slide.enter * { animation: none !important; } }

  /* controles (aparecem quando mexe o mouse) */
  #ctl { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: flex; gap: 8px; opacity: 0; transition: opacity 200ms var(--ease); }
  #ctl.show, #ctl:focus-within { opacity: 1; }
  #ctl button { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: var(--r-btn); background: rgba(19,24,36,.92); color: var(--text); border: 1px solid var(--line-strong); font-size: 15px; font-weight: 500; }
  #help { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 10; background: rgba(19,24,36,.95); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 10px 16px; font-size: 14px; color: var(--muted); transition: opacity 400ms var(--ease); }
  #help b { color: var(--text); font-weight: 500; }
  #help.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="top">
      <div class="show">Genocídio na Palestina <span>· Sociologia</span></div>
      <div class="sp"></div>
      <div class="who" id="who"></div>
      <div class="count" id="count"></div>
    </div>
    <div id="slide"></div>
    <div id="bar"></div>
  </div>
</div>
<div id="ctl">
  <button type="button" id="bPrev" aria-label="Slide anterior">&larr;</button>
  <button type="button" id="bNext" aria-label="Próximo slide">&rarr;</button>
  <button type="button" id="bFs">Tela cheia</button>
</div>
<div id="help"><b>&rarr;</b> ou clique: próximo · <b>&larr;</b>: voltar · <b>F</b>: tela cheia</div>

<script src="js/slides.js"></script>
<script src="js/fotos.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Versão sem celular: só a apresentação. Sem QR Code, sem as regras e sem as perguntas pra sala.
  const OVR = {
    capa: { body: '<p class="lead">O que está acontecendo em Gaza, os dois lados e a opinião do nosso grupo.</p>' },
    fim: { kicker: 'Obrigado!', title: 'Obrigado pela atenção!' },
  };
  const SKIP = ['regras', 'central'];
  const LIST = SLIDES.filter(s => s.layout !== 'qr' && s.layout !== 'question' && !SKIP.includes(s.id)).map(s => Object.assign({}, s, OVR[s.id] || {}));
  LIST.push({ id: 'creditos', layout: 'credits', kicker: 'Créditos', title: 'Fotos usadas', speaker: '' });

  function photo(id, cls) {
    const f = (window.FOTOS || {})[id]; if (!f) return '';
    return `<figure class="ph ${cls || ''}"><div class="img"><img src="${esc(f.src)}" alt="${esc(f.cap)}" loading="eager" decoding="async" onerror="this.style.visibility='hidden'"></div>
      <figcaption>${esc(f.cap)}<small>Foto: <bdi>${esc(f.credit.split(' · ')[0])}</bdi> · ${esc(f.credit.split(' · ')[1] || '')} · Wikimedia Commons</small></figcaption></figure>`;
  }
  const heroPhoto = id => { const f = (window.FOTOS || {})[id]; if (!f) return '';
    return `<figure class="ph"><img src="${esc(f.src)}" alt="${esc(f.cap)}" decoding="async" onerror="this.style.visibility='hidden'">
      <figcaption>${esc(f.cap)}<small>Foto: <bdi>${esc(f.credit.split(' · ')[0])}</bdi> · ${esc(f.credit.split(' · ')[1] || '')} · Wikimedia Commons</small></figcaption></figure>`; };

  function html(sl) {
    const k = `<div class="kicker">${esc(sl.kicker || '')}</div>`;
    const t = `<h1>${esc(sl.title)}</h1>`;
    const F = window.FOTOS || {};
    if (sl.layout === 'credits') {
      const items = LIST.map(x => F[x.id]).filter(Boolean).map(f => `<div><b>${esc(f.cap)}</b><br><bdi>${esc(f.credit.split(' · ')[0])}</bdi> · ${esc(f.credit.split(' · ')[1] || '')}</div>`).join('');
      return { cls: '', inner: `<div class="content">${k}${t}<div class="body"><div class="credits">${items}</div><p class="note">Todas as fotos são do Wikimedia Commons, com licença livre.</p></div></div>` };
    }
    if (sl.layout === 'cover') {
      return { cls: 'hero cover', inner: heroPhoto(sl.id) + `<div class="content" style="justify-content:center">${k}${t}<div class="body" style="flex:0">${sl.body || ''}</div></div>` };
    }
    if (F[sl.id]) return { cls: 'side', inner: photo(sl.id, sl.id === 'onde' ? 'map' : '') + `<div class="content">${k}${t}<div class="body">${sl.body || ''}</div></div>` };
    return { cls: '', inner: `<div class="content">${k}${t}<div class="body">${sl.body || ''}</div></div>` };
  }

  /* ---- navegação ---- */
  let cur = Math.max(0, Math.min(LIST.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  const slideEl = $('slide');
  function show(n, anim) {
    cur = Math.max(0, Math.min(LIST.length - 1, n));
    const sl = LIST[cur]; const h = html(sl);
    slideEl.className = h.cls;
    slideEl.innerHTML = h.inner;
    if (anim) { slideEl.classList.add('enter'); }
    $('who').innerHTML = sl.speaker ? `Com <b>${esc(sl.speaker)}</b>` : '';
    $('count').textContent = `${cur + 1}/${LIST.length}`;
    $('bar').style.width = ((cur + 1) / LIST.length * 100) + '%';
    try { history.replaceState(null, '', '#' + (cur + 1)); } catch {}
  }
  const next = () => { if (cur < LIST.length - 1) show(cur + 1, true); };
  const prev = () => { if (cur > 0) show(cur - 1, true); };
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'Home') show(0, true);
    else if (k === 'End') show(LIST.length - 1, true);
    else if (k === 'f' || k === 'F') fullscreen();
  });
  // clique: metade direita avança, metade esquerda volta
  $('wrap').addEventListener('click', e => { if (e.clientX > innerWidth / 2) next(); else prev(); });
  let tx = null;
  $('wrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  $('wrap').addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); } tx = null; });
  $('bPrev').onclick = e => { e.stopPropagation(); prev(); };
  $('bNext').onclick = e => { e.stopPropagation(); next(); };
  $('bFs').onclick = e => { e.stopPropagation(); fullscreen(); };
  function fullscreen() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch {}
  }
  let hideT = null;
  addEventListener('mousemove', () => { $('ctl').classList.add('show'); clearTimeout(hideT); hideT = setTimeout(() => $('ctl').classList.remove('show'), 2200); });
  setTimeout(() => $('help').classList.add('hide'), 6000);

  /* ---- escala 1920x1080 na tela ---- */
  const stage = $('stage');
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
  addEventListener('resize', fit); fit();
  show(cur, false);
  // baixa todas as fotos logo de cara, pra nenhum slide abrir vazio
  window.addEventListener('load', () => Object.values(window.FOTOS || {}).forEach(f => { const i = new Image(); i.src = f.src; }));
})();
</script>
</body>
</html>
